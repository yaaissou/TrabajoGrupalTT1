<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Partida creada</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh;
               display: flex; align-items: center; justify-content: center; }
        .card { background: #16213e; border-radius: 16px; padding: 48px 40px; text-align: center;
                max-width: 460px; width: 100%; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
        h1 { color: #7ec8e3; margin-bottom: 10px; font-size: 1.6em; }
        p  { color: #aaa; margin-bottom: 32px; font-size: 0.95em; }
        .token-box { background: #0f3460; border-radius: 12px; padding: 20px 32px; margin-bottom: 36px; }
        .token-label { font-size: 0.8em; color: #888; margin-bottom: 6px; letter-spacing: 1px; text-transform: uppercase; }
        .token-valor { font-size: 3em; font-weight: bold; color: #e94560; letter-spacing: 4px; }
        .enlace { display: inline-block; background: #e94560; color: #fff; text-decoration: none;
                  padding: 14px 36px; border-radius: 10px; font-size: 1.05em; font-weight: bold;
                  transition: background 0.2s; }
        .enlace:hover { background: #c73652; }
        .volver { display: block; margin-top: 20px; color: #7ec8e3; text-decoration: none; font-size: 0.85em; }
        .volver:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="card">
    <h1>⚓ ¡Partida lista!</h1>
    <p>Tu simulación ha sido generada. Guarda el token para acceder a la partida.</p>

    <div class="token-box">
        <div class="token-label">Tu token</div>
        <div class="token-valor" th:text="${token}">—</div>
    </div>

    <a class="enlace" th:href="@{/juego/partida(tok=${token})}">▶ Ver partida</a>
    <a class="volver" href="/test.html">← Nueva partida</a>
</div>
</body>
</html>
