<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Token no encontrado</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh;
               display: flex; align-items: center; justify-content: center; }
        .card { background: #16213e; border-radius: 16px; padding: 48px 40px; text-align: center;
                max-width: 460px; width: 100%; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
        .icono { font-size: 3.5rem; margin-bottom: 16px; }
        h1 { color: #e94560; margin-bottom: 12px; font-size: 1.6em; letter-spacing: 1px; }
        .mensaje { color: #aaa; margin-bottom: 32px; font-size: 0.95em; line-height: 1.5; }
        .mensaje span { color: #e94560; font-weight: bold; }
        .enlace { display: inline-block; background: #0f3460; color: #7ec8e3; text-decoration: none;
                  padding: 12px 32px; border-radius: 10px; font-size: 1em; transition: background 0.2s; }
        .enlace:hover { background: #7ec8e3; color: #1a1a2e; }
    </style>
</head>
<body>
<div class="card">
    <div class="icono">&#128683;</div>
    <h1>Token no encontrado</h1>
    <p class="mensaje" th:text="${error}">El token solicitado no existe o ha caducado.</p>
    <a class="enlace" href="/test.html">← Nueva partida</a>
</div>
</body>
</html>
