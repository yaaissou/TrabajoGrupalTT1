name: Validar Tests y Actualizar Early

on:
  push:
    branches: [ "main" ]

jobs:
  test-and-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Descargar el código
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Configurar Java 23
      uses: actions/setup-java@v3
      with:
        java-version: '23'
        distribution: 'temurin'
        cache: maven 

    - name: Ejecutar Tests con Maven
      run: |
        cd servidor
        mvn clean test

    - name: Actualizar rama early
      if: success() 
      run: |
        git config --global user.name 'GitHub Action Bot'
        git config --global user.email 'action@github.com'
        git checkout early
        git merge main --allow-unrelated-histories
        git push origin early
